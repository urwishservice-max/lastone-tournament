server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lastzone-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lastzone}
    username: ${SPRING_DATASOURCE_USERNAME:lastzone}
    password: ${SPRING_DATASOURCE_PASSWORD:lastzone_secret}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c3BhcnRhbi1sYXN0LXpvbmUtc3VwZXItc2VjcmV0LWtleS01MTJiaXRzLW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhzNTEy}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
