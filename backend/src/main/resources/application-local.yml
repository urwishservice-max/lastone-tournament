spring:
  datasource:
    url: jdbc:h2:file:./data/lastzonedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

